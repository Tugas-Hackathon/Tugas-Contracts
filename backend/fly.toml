# fly launch --no-deploy  then  fly deploy
app = "tugas-api"
primary_region = "sin"          # Singapore — closest region to Malaysia

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  RPC_URL = "https://rpc.bohr.life"
  LEDGER_ADDRESS = "0xE2c7c1c96F45de15D2cDBb02dfF1E18f97106A76"
  BOT_URL = "http://127.0.0.1:8787"

# SQLite, uploaded materials and WhatsApp sessions live here. Without this
# mount every deploy starts from an empty database.
[[mounts]]
  source = "tugas_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # A WhatsApp session is held in memory by a live Chromium. Suspending the
  # machine drops it and the student has to scan the QR again, so keep one
  # machine running rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # Chromium needs roughly 500MB per linked account. 1GB covers the API plus
  # one session; raise this before more than one person links at a time.
  memory = "1gb"
