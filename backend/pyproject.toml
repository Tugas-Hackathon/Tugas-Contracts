[project]
name = "tugas-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "eth-account>=0.13",
    "pypdf>=4.3",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openai>=1.40",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24"]
